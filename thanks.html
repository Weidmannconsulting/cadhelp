<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you — CADHELP.ie</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .thanks-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f9fc}
    .thanks-box{width:min(100%,560px);padding:42px 30px;text-align:center;border-radius:12px;background:#fff;box-shadow:0 15px 40px rgba(8,40,75,.1)}
    .thanks-icon{font-size:50px;color:#05ca72}.thanks-box h1{font-size:34px;margin:12px 0}.thanks-box p{line-height:1.6;color:#526b83;margin-bottom:26px}
  </style>
</head>
<body>
  <main class="thanks-page">
    <div class="thanks-box">
      <div class="thanks-icon" aria-hidden="true">✓</div>
      <h1>Thank you!</h1>
      <p>Your request has been submitted. We’ll review your files and get back to you by email.</p>
      <a class="btn btn-green" href="/">Back to CADHELP.ie</a>
    </div>
  </main>
</body>
</html>
